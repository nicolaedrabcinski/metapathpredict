# MetaPathPredict - GPU training/inference stack
#
# The heavier "data engineering" stack (MinIO, Postgres, Ray, Dagster,
# DataHub, Prometheus, Grafana) was removed: it only backed
# src/metapathpredict/pipeline/, which nothing in the actual CLI
# (metapathpredict train/prepare) or API imports. That code still exists
# as unused optional scaffolding; bring the services back if it gets wired up.

services:
  # MetaPathPredict Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: metapathpredict-app
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    command: python -m metapathpredict.cli train --pipeline full --config /app/configs/train_cpu.yaml

networks:
  default:
    name: metapathpredict-network
