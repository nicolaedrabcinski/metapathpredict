# MetaPathPredict - Data Engineering Stack
# Based on: DuckDB + DuckLake + MinIO + PostgreSQL + Ray + Dagster

services:
  # ===========================================
  # STORAGE LAYER
  # ===========================================
  
  # MinIO - S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: metapathpredict-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/metapathpredict --ignore-existing;
      mc mb myminio/metapathpredict-models --ignore-existing;
      mc mb myminio/metapathpredict-datasets --ignore-existing;
      mc mb myminio/metapathpredict-artifacts --ignore-existing;
      exit 0;
      "

  # ===========================================
  # CATALOG / METADATA
  # ===========================================
  
  # PostgreSQL - Metadata catalog for DuckLake
  postgres:
    image: postgres:15-alpine
    container_name: metapathpredict-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: metapathpredict
      POSTGRES_PASSWORD: metapathpredict123
      POSTGRES_DB: catalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metapathpredict -d catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # COMPUTE LAYER
  # ===========================================
  
  # Ray Head Node - Distributed computing
  ray-head:
    image: rayproject/ray:2.9.0-py310-gpu
    container_name: metapathpredict-ray-head
    ports:
      - "8265:8265"   # Ray Dashboard
      - "10001:10001" # Ray Client
    command: >
      ray start --head --port=6379 
      --dashboard-host=0.0.0.0 
      --dashboard-port=8265 
      --block
    environment:
      RAY_GRAFANA_HOST: http://grafana:3000
    volumes:
      - ray_data:/tmp/ray
    shm_size: '2gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Ray Worker Node
  ray-worker:
    image: rayproject/ray:2.9.0-py310-gpu
    depends_on:
      - ray-head
    command: >
      ray start --address=ray-head:6379 --block
    volumes:
      - ray_data:/tmp/ray
    shm_size: '2gb'
    deploy:
      replicas: 2
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ===========================================
  # ORCHESTRATION
  # ===========================================
  
  # Dagster - Pipeline orchestration
  dagster-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.dagster
    container_name: metapathpredict-dagster-webserver
    ports:
      - "3000:3000"
    command: dagster-webserver -h 0.0.0.0 -p 3000
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_USER: metapathpredict
      DAGSTER_POSTGRES_PASSWORD: metapathpredict123
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgres
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      RAY_ADDRESS: ray://ray-head:10001
    volumes:
      - ./src:/opt/dagster/app
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      - postgres
      - minio
      - ray-head

  dagster-daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile.dagster
    container_name: metapathpredict-dagster-daemon
    command: dagster-daemon run
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_USER: metapathpredict
      DAGSTER_POSTGRES_PASSWORD: metapathpredict123
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgres
    volumes:
      - ./src:/opt/dagster/app
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      - postgres
      - dagster-webserver

  # ===========================================
  # DATA GOVERNANCE
  # ===========================================
  
  # DataHub - Data catalog and governance (optional)
  datahub-gms:
    image: linkedin/datahub-gms:latest
    container_name: metapathpredict-datahub-gms
    ports:
      - "8080:8080"
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: 8080
      EBEAN_DATASOURCE_HOST: postgres:5432
      EBEAN_DATASOURCE_USERNAME: metapathpredict
      EBEAN_DATASOURCE_PASSWORD: metapathpredict123
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
    depends_on:
      - postgres
    profiles:
      - datahub

  # ===========================================
  # MONITORING
  # ===========================================
  
  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: metapathpredict-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    profiles:
      - monitoring

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: metapathpredict-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # ===========================================
  # ML APPLICATION
  # ===========================================
  
  # MetaPathPredict Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: metapathpredict-app
    ports:
      - "8000:8000"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      POSTGRES_HOST: postgres
      POSTGRES_USER: metapathpredict
      POSTGRES_PASSWORD: metapathpredict123
      RAY_ADDRESS: ray://ray-head:10001
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - minio
      - postgres
      - ray-head
    command: python -m metapathpredict.cli train --config /app/config.yaml

volumes:
  minio_data:
  postgres_data:
  ray_data:
  dagster_home:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: metapathpredict-network
