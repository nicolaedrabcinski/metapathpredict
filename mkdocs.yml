site_name: MetaPathPredict
site_description: Deep Learning for Metagenomic Sequence Classification
site_author: MetaPathPredict Team
site_url: https://metapathpredict.github.io/

repo_name: metapathpredict/metapathpredict
repo_url: https://github.com/metapathpredict/metapathpredict

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/metapathpredict/metapathpredict
  version:
    provider: mike

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Data Preparation: user-guide/data-preparation.md
    - Training: user-guide/training.md
    - Inference: user-guide/inference.md
    - Experiment Tracking: user-guide/tracking.md
  - Training Approaches:
    - Overview: training-approaches/overview.md
    - Configurable CNN: training-approaches/cnn.md
    - Contrastive Learning: training-approaches/contrastive.md
    - Reinforcement Learning: training-approaches/reinforcement.md
  - API Reference:
    - Config: api/config.md
    - Data: api/data.md
    - Models: api/models.md
    - Training: api/training.md
    - Inference: api/inference.md
  - Deployment:
    - Docker: deployment/docker.md
    - Cloud (GCP): deployment/cloud.md
    - Terraform: deployment/terraform.md
  - Contributing: contributing.md
  - Changelog: changelog.md
