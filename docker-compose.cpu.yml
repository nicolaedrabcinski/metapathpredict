# MetaPathPredict - Minimal Stack (CPU-only)
# For development and testing without GPU

services:
  # ===========================================
  # STORAGE LAYER
  # ===========================================
  
  # MinIO - S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: metapathpredict-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/metapathpredict --ignore-existing;
      mc mb myminio/metapathpredict-models --ignore-existing;
      mc mb myminio/metapathpredict-datasets --ignore-existing;
      mc mb myminio/metapathpredict-artifacts --ignore-existing;
      exit 0;
      "

  # ===========================================
  # CATALOG / METADATA
  # ===========================================
  
  # PostgreSQL - Metadata catalog
  postgres:
    image: postgres:15-alpine
    container_name: metapathpredict-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: metapathpredict
      POSTGRES_PASSWORD: metapathpredict123
      POSTGRES_DB: catalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metapathpredict -d catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # ML APPLICATION
  # ===========================================
  
  # MetaPathPredict Application (CPU-only)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    container_name: metapathpredict-app
    ports:
      - "8888:8000"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      POSTGRES_HOST: postgres
      POSTGRES_USER: metapathpredict
      POSTGRES_PASSWORD: metapathpredict123
      POSTGRES_DB: catalog
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    working_dir: /app
    stdin_open: true
    tty: true

volumes:
  minio_data:
  postgres_data:

networks:
  default:
    name: metapathpredict-network
