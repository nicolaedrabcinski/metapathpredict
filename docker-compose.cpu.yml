# MetaPathPredict - Minimal CPU-only stack (development/testing without GPU)
#
# The heavier "data engineering" stack (MinIO, Postgres) was removed: it only
# backed src/metapathpredict/pipeline/, which nothing in the actual CLI
# (metapathpredict train/prepare) or API/dashboard imports. That code still
# exists as unused optional scaffolding; bring the services back if it gets
# wired up.

services:
  # MetaPathPredict Application (CPU-only)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    container_name: metapathpredict-app
    ports:
      - "8888:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./configs:/app/configs
    working_dir: /app
    stdin_open: true
    tty: true

  # SeqSort Dashboard - React + FastAPI
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: metapathpredict-dashboard
    ports:
      - "3002:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    profiles:
      - dashboard

networks:
  default:
    name: metapathpredict-network
