[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metapathpredict"
version = "2.0.0"
description = "DNA sequence classification using Contrastive Learning and Deep Reinforcement Learning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MetaPathPredict Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "deep-learning",
    "bioinformatics",
    "dna-classification",
    "metagenomics",
    "pytorch",
    "contrastive-learning",
    "reinforcement-learning",
    "simclr",
    "actor-critic",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "h5py>=3.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
]
pipeline = [
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "boto3>=1.28.0",
]
distributed = [
    "ray[train,tune]>=2.8.0",
]
orchestration = [
    "dagster>=1.5.0",
    "dagster-webserver>=1.5.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
]
tracking = [
    "mlflow>=2.10.0",
    "wandb>=0.16.0",
]
all = [
    "metapathpredict[dev,api,viz,pipeline,distributed,orchestration,docs,tracking]",
]

[project.scripts]
metapathpredict = "metapathpredict.cli:main"

[project.urls]
Homepage = "https://github.com/nicolaedrabcinski/metapathpredict"
Documentation = "https://github.com/nicolaedrabcinski/metapathpredict#readme"
Repository = "https://github.com/nicolaedrabcinski/metapathpredict"
Issues = "https://github.com/nicolaedrabcinski/metapathpredict/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/metapathpredict"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

# Ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict
    "C901",   # too complex
]

[tool.ruff.isort]
known-first-party = ["metapathpredict"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001"]

# Black configuration
[tool.black]
target-version = ["py310", "py311", "py312"]
line-length = 100
include = '\.pyi?$'

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "h5py.*",
    "sklearn.*",
    "torch.*",
    "tqdm.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests as requiring GPU",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/metapathpredict"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
