# MetaPathPredict Training Configuration
# CPU-friendly settings (smaller backbone/batches than configs/train_gpu.yaml)
#
# Needs a dataset prepared first, e.g.:
#   metapathpredict prepare --manifest data/genomes/manifest.tsv --config configs/train_cpu.yaml \
#       --output data/datasets/taxa8 --length 500 --fragments-per-class 30000

# Data configuration
data:
  default_fragment_size: 500
  num_workers: 4
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Contrastive learning configuration
contrastive:
  backbone: "medium"
  base_channels: 64
  projection_dim: 128
  hidden_dim: 256
  loss_type: "ntxent"
  temperature: 0.07
  mutation_rate: 0.1
  mask_rate: 0.15
  num_epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 32
  early_stopping_patience: 7
  probe_epochs: 15

scheduler:
  name: cosine
  warmup_epochs: 2

# Reinforcement learning configuration
rl:
  algorithm: "actor_critic"
  backbone: "medium"
  hidden_dim: 256
  reward_correct: 1.0
  reward_incorrect: -0.5
  reward_uncertain: -0.1
  num_epochs: 10
  episodes_per_epoch: 1000
  learning_rate: 0.0001
  weight_decay: 0.0001
  gamma: 0.99
  early_stopping_patience: 7
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_epochs: 5
  replay_buffer_size: 10000
  target_update_freq: 5

# Project settings
project_name: "metapathpredict-cpu"
experiment_name: "cpu-training"

# Paths
paths:
  base_dir: "."
  data_dir: "data"
  datasets_dir: "data/datasets/taxa8"
  weights_dir: "data/weights/taxa8"
  predictions_dir: "data/output/predictions"
  logs_dir: "logs"
