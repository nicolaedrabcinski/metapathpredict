# MetaPathPredict Training Configuration
# CPU-optimized settings

# Data configuration
data:
  default_fragment_size: 500
  num_workers: 16
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

# Model configuration
model:
  model_type: "multi_scale_cnn"
  num_classes: 3
  kernel_sizes: [5, 7, 11]
  num_filters: [32, 64, 128]
  hidden_dims: [256, 128]
  dropout_rate: 0.3
  use_batch_norm: true

# Training configuration
training:
  num_epochs: 10
  batch_size: 128
  learning_rate: 0.002
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 2
  use_amp: false
  gradient_clip_val: 1.0
  patience: 5

# Contrastive learning configuration
contrastive:
  backbone: "medium"
  base_channels: 64
  projection_dim: 128
  hidden_dim: 256
  loss_type: "ntxent"
  temperature: 0.07
  mutation_rate: 0.1
  mask_rate: 0.15
  num_epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 128

# Reinforcement learning configuration
rl:
  algorithm: "actor_critic"
  backbone: "medium"
  hidden_dim: 256
  reward_correct: 1.0
  reward_incorrect: -0.5
  reward_uncertain: -0.1
  num_epochs: 10
  episodes_per_epoch: 1000
  learning_rate: 0.0001
  weight_decay: 0.0001
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_epochs: 5
  replay_buffer_size: 10000
  target_update_freq: 5

# Project settings
project_name: "metapathpredict-unified"
experiment_name: "cpu-training"

# Paths (relative to project root, resolved at runtime)
paths:
  base_dir: "."
  data_dir: "data"
  datasets_dir: "data/datasets/unified"
  weights_dir: "data/weights/unified"
  predictions_dir: "data/output/predictions"
  logs_dir: "logs"
