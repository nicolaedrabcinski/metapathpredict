# MetaPathPredict Training Configuration
# GPU-optimized settings (single GPU, NVIDIA)

# Data configuration
data:
  default_fragment_size: 500
  num_workers: 8
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Contrastive learning configuration
contrastive:
  backbone: "large"
  base_channels: 128
  projection_dim: 512
  hidden_dim: 1024
  loss_type: "ntxent"
  temperature: 0.07
  mutation_rate: 0.3
  mask_rate: 0.3
  num_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 2048
  early_stopping_patience: 3

scheduler:
  name: cosine
  warmup_epochs: 2

# Reinforcement learning configuration
rl:
  algorithm: "actor_critic"
  backbone: "large"
  hidden_dim: 256
  reward_correct: 1.0
  reward_incorrect: -0.5
  reward_uncertain: -0.1
  num_epochs: 50
  episodes_per_epoch: 16000
  learning_rate: 0.0001
  weight_decay: 0.0001
  gamma: 0.99
  early_stopping_patience: 3
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_epochs: 5
  replay_buffer_size: 10000
  target_update_freq: 5

# Project settings
project_name: "metapathpredict-gpu"
experiment_name: "gpu-training"

# Paths
paths:
  base_dir: "."
  data_dir: "data"
  datasets_dir: "data/datasets/taxa8"
  weights_dir: "data/weights/taxa8"
  predictions_dir: "data/output/predictions"
  logs_dir: "logs"
