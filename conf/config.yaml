# Hydra experiment config, mirrors configs/train_gpu.yaml. Every run gets its own tracked
# directory under experiments/ with the resolved config and the log.
#
# Usage:
#   python scripts/run_experiment.py experiment_name=bs512 contrastive.batch_size=512 contrastive.learning_rate=2.8e-4
#   python scripts/run_experiment.py pipeline=full            # also run the RL phase

experiment_name: baseline
pipeline: contrastive   # contrastive = encoder + linear probe; full = also RL fine-tuning
max_threads: 16

# MLflow: parameters, per-epoch metrics, CPU/GPU/memory metrics and test-split scores per run.
# uri null = sqlite:///<repo>/mlflow.db ; view with `mlflow ui --backend-store-uri sqlite:///mlflow.db`
tracking:
  enabled: true
  uri: null
  system_metrics: true

data:
  default_fragment_size: 500
  num_workers: 8
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Loader batch size for the RL phase and evaluation (contrastive has its own below).
training:
  batch_size: 64

contrastive:
  backbone: "large"
  base_channels: 128
  projection_dim: 512
  hidden_dim: 1024
  norm: batch
  loss_type: "ntxent"
  temperature: 0.07
  supcon_weight: 0.5
  mutation_rate: 0.3
  mask_rate: 0.3
  num_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 64
  early_stopping_patience: 7
  probe_epochs: 15
  per_sample_augmentation: true
  debias_tau_plus: 0.0
  hard_negative_beta: 0.0

rl:
  algorithm: "actor_critic"
  backbone: "large"
  hidden_dim: 256
  reward_correct: 1.0
  reward_incorrect: -0.5
  reward_uncertain: -0.1
  num_epochs: 50
  episodes_per_epoch: 64000
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  gamma: 0.99
  early_stopping_patience: 7

project_name: "metapathpredict-experiments"

paths:
  base_dir: "."
  data_dir: "data"
  datasets_dir: "data/datasets/taxa8"
  # weights_dir / logs_dir are overridden at runtime to the Hydra run dir
  weights_dir: "data/weights/taxa8"
  predictions_dir: "data/output/predictions"
  logs_dir: "logs"

hydra:
  run:
    dir: experiments/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: experiments/${experiment_name}
    subdir: ${now:%Y-%m-%d_%H-%M-%S}_${hydra.job.num}
  job:
    chdir: false
